input {
  file {
    path => ["/var/log/app-logs/*.log", "/var/log/app-logs/*.txt"] #"/var/log/app-logs/*" #todos los archivos o varios patrones path => ["/var/log/app-logs/*.log", "/var/log/app-logs/*.txt"]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-app-logs"
      codec => multiline {
      #Tratar excepciones que no tienen timestamp en un documento solo
      pattern => "^\s*\d{4}-\d{2}-\d{2}" # Revisar patrón de excepciones sin ts y con espacio al inicio
      negate  => true          # NO Hay timestamp
      what    => "previous"    # Pego el timestamp anterior, común para excepciones
      charset => "UTF-8"
    }
  }
}

filter {
  ######################################################################
  # 1) Extraer el nombre del archivo para usarlo como nombre de índice
  ######################################################################
  grok {
    match => {
      "[log][file][path]" => [ ".*/(?<log_source>[^/]+)\.[^./]+$" ]
    }
    tag_on_failure => ["_grok_filename_failure"]
  }

 # Normalizar el nombre y setear el índice
  if "_grok_filename_failure" in [tags] or ![log_source] {
    # fallback: si no pudimos sacar log_source, usamos generic-logs
    mutate {
      add_field => { "[@metadata][index_name]" => "generic-logs" }
    }
  } else {
    # tenemos log_source: lo normalizamos
    mutate {
      # solo a minúsculas, sin gsub raro
      lowercase => [ "log_source" ]
      add_field => { "[@metadata][index_name]" => "%{log_source}" }
    }
  }

  ######################################################################
  # 2) Parseo "general" del encabezado de log
  # Intentamos varios formatos:
  #   a) timestamp + tz + [LEVEL] + mensaje
  #   b) timestamp + mensaje
  # Si nada matchea, quedará todo en message.
  ######################################################################
  grok {
    match => {
      "message" => [

         # A) Ej: 2025-12-01T11:01:11,589 | INFO | ...
        "^%{TIMESTAMP_ISO8601:log_timestamp}\s+\|\s+%{LOGLEVEL:log_level}\s+\|\s+%{GREEDYDATA:log_message}$",

        # B) Ej: 2025-12-01T11:01:11,589 INFO mensaje...
        "^%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+%{GREEDYDATA:log_message}$",

        # C) Ej: 2025-08-27 10:28:39.202 -06:00 [INF] mensaje...
        "^%{TIMESTAMP_ISO8601:log_timestamp}\s+%{ISO8601_TIMEZONE:timezone}\s+\[%{LOGLEVEL:log_level}\]\s+%{GREEDYDATA:log_message}$",

        # D) timestamp + mensaje (fallback genérico)
        "^%{TIMESTAMP_ISO8601:log_timestamp}\s+%{GREEDYDATA:log_message}$"

      ]
    }
    tag_on_failure => ["_grok_header_failure"]
  }

  # Si pudimos sacar log_timestamp, usarlo como @timestamp
  if [log_timestamp] {
    date {
      match => [
        "log_timestamp",
        "ISO8601",
        "yyyy-MM-dd HH:mm:ss.SSS",
        "yyyy-MM-dd HH:mm:ss",
        "yyyy-MM-dd'T'HH:mm:ss,SSS",
        "yyyy-MM-dd HH:mm:ss,SSS"
      ]
      target => "@timestamp"
    }
  }

  # Si NO pudimos armar log_message (o el grok falló), nos aseguramos
  # de tener log_message al menos igual a message
  if ![log_message] {
    mutate {
      add_field => { "log_message" => "%{message}" }
    }
  }


  # Método + URL + versión HTTP, muy general
  grok {
    match => {
      # Ej: "Request finished HTTP/1.1 GET https://... "
      "log_message" => [
        "HTTP/%{NUMBER:http_version} %{WORD:http_method} %{URI:url}"
      ]
    }
    tag_on_failure => []
  }

  grok {
    match => {
      "log_message" => [
        "HTTP/%{NUMBER:http_version} %{WORD:http_method} %{URI:url}"
      ]
    }
    tag_on_failure => []
  }

  # Status code 
  grok {
    match => {
      "log_message" => [
        # Ej: " - 200 null text/html ..."
        " - %{INT:status} ",
        # Variante más laxa: cualquier status al final de algo
        "%{INT:status} [A-Za-z].*"
      ]
    }
    tag_on_failure => []
  }

  # Duración en ms: cualquier número seguido de ms
  grok {
    match => {
      "log_message" => [
        "%{NUMBER:duration_ms:float}ms"
      ]
    }
    tag_on_failure => []
  }


  mutate {
    remove_field => [ "host", "log_timestamp" ]  # opcional
  }
}

output {
  ######################################################################
  # 5) Salida a Elasticsearch con índice dinámico por nombre de archivo
  ######################################################################
  elasticsearch {
    hosts => [ "http://elasticsearch-dataset:9200" ]
    # El índice será, por ejemplo, "app1", "ventas-api", etc.
    index => "%{[@metadata][index_name]}"
  }

  # Para debug: ver en consola lo que está saliendo
  #stdout {
  #  codec => rubydebug
  #}
}

