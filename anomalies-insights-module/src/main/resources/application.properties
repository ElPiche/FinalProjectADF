spring.application.name=anomalies-insights-module
spring.profiles.active=local
spring.config.import=optional:classpath:application-secrets.properties
server.port=8081
server.error.include-message=never
server.error.include-stacktrace=never
spring.output.ansi.enabled=always
#Swagger config
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/
spring.elasticsearch.uris=http://localhost:9200
kibana.base-url=http://localhost:5601

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=adfnotificationsnoreply@gmail.com
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email rate limiting configuration
email.rate-limit.max-per-hour=10
email.rate-limit.cooldown-minutes=5