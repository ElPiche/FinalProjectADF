input {
        elasticsearch {
            id => "fec117c9-457a-49f4-841e-0f0a4dcd83be"
            hosts => [ "http://elasticsearch-dataset:9200/" ]
            query_type => "esql"
            query => 'FROM .ds-kibana_sample_data_logs-* | WHERE @timestamp >= "2025-10-01T00:00:00.000Z" AND @timestamp < "2025-11-01T00:00:00.000Z" | EVAL es_timestamp = DATE_TRUNC(1 hour, @timestamp) | STATS request_count = COUNT(*), avg_bytes_per_request = AVG(bytes) BY es_timestamp | SORT es_timestamp'
            schedule => "*/5 * * * *"
            ecs_compatibility => disabled
        }
    }

    filter {
        mutate {
            add_field => { "kb_id" => "fec117c9-457a-49f4-841e-0f0a4dcd83be" }
        }
    }

    output {
        mongodb {
            uri => "mongodb://admin:1q2w3E*@mongodb:27017/?authSource=admin"
            database => "logsdb"
            collection => "fec117c9-457a-49f4-841e-0f0a4dcd83be"
            isodate => true
        }
        stdout { codec => rubydebug }
    }