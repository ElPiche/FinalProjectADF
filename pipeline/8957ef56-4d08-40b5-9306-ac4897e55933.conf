input {
        elasticsearch {
            id => "8957ef56-4d08-40b5-9306-ac4897e55933"
            hosts => [ "http://elasticsearch-dataset:9200/" ]
            query_type => "esql"
            query => 'FROM .ds-kibana_sample_data_logs-* | WHERE @timestamp >= "2025-10-21T00:00:00.000Z" AND @timestamp < "2025-11-28T00:00:00.000Z" | EVAL es_timestamp = DATE_TRUNC(1 hour, @timestamp) | STATS request_count = COUNT(*), unique_ips = COUNT_DISTINCT(clientip), avg_bytes = AVG(bytes), status_404_count = COUNT(*) WHERE response == "404" BY es_timestamp | SORT es_timestamp'
            schedule => "0 * * * *"
            ecs_compatibility => disabled
        }
    }

    output {
        mongodb {
            uri => "mongodb://admin:1q2w3E*@mongodb:27017/?authSource=admin"
            database => "logsdb"
            collection => "8957ef56-4d08-40b5-9306-ac4897e55933"
            isodate => true
        }
        stdout { codec => rubydebug }
    }