input {
        elasticsearch {
            id => "88c9d6b6-b053-4b48-a404-7fd93d6e8d96"
            hosts => [ "http://elasticsearch-dataset:9200/" ]
            query_type => "esql"
            query => 'FROM .ds-kibana_sample_data_logs-* | WHERE @timestamp >= "2025-10-01T00:00:00.000Z" AND @timestamp < "2025-11-01T00:00:00.000Z" | EVAL es_timestamp = DATE_TRUNC(1 hour, @timestamp) | STATS avg_memory_mb = AVG(machine.ram) / 1048576 BY es_timestamp | SORT es_timestamp'
            schedule => "*/5 * * * *"
            ecs_compatibility => disabled
        }
    }

    filter {
        mutate {
            add_field => { "kb_id" => "88c9d6b6-b053-4b48-a404-7fd93d6e8d96" }
        }
    }

    output {
        mongodb {
            uri => "mongodb://admin:1q2w3E*@mongodb:27017/?authSource=admin"
            database => "logsdb"
            collection => "88c9d6b6-b053-4b48-a404-7fd93d6e8d96"
            isodate => true
        }
        stdout { codec => rubydebug }
    }