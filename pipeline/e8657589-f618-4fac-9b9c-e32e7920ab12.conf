input {
        elasticsearch {
            id => "e8657589-f618-4fac-9b9c-e32e7920ab12"
            hosts => [ "http://elasticsearch-dataset:9200/" ]
            query_type => "esql"
            query => 'FROM .ds-kibana_sample_data_logs-* | WHERE @timestamp >= "2025-10-21T00:00:00.000Z" AND @timestamp < "2025-11-28T00:00:00.000Z" | EVAL es_timestamp = DATE_TRUNC(1 hour, @timestamp) | STATS status_code_200_counter = COUNT(*) WHERE response == "200", status_code_5xx_counter = COUNT(*) WHERE response >= "500" AND response < "600", avg_bytes = AVG(bytes) BY es_timestamp | SORT es_timestamp'
            schedule => "*/10 * * * *"
            ecs_compatibility => disabled
        }
    }

    output {
        mongodb {
            uri => "mongodb://admin:1q2w3E*@mongodb:27017/?authSource=admin"
            database => "logsdb"
            collection => "e8657589-f618-4fac-9b9c-e32e7920ab12"
            isodate => true
        }
        stdout { codec => rubydebug }
    }