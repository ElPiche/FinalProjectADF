input {
        elasticsearch {
            id => "8402f39f-493d-4dbd-916b-920aa79497a9"
            hosts => [ "http://elasticsearch-dataset:9200/" ]
            query_type => "esql"
            query => 'FROM .ds-kibana_sample_data_logs-* | WHERE @timestamp >= "2023-10-01T00:00:00.000Z" AND @timestamp < "2023-11-01T00:00:00.000Z" | EVAL es_timestamp = DATE_TRUNC(1 hour, @timestamp) | STATS status_code_200_counter = COUNT(*) WHERE response == "200", status_code_5xx_counter = COUNT(*) WHERE response >= "500" AND response < "600", avg_bytes = AVG(bytes) BY es_timestamp | SORT es_timestamp'
            ecs_compatibility => disabled
        }
    }

    output {
        mongodb {
            uri => "mongodb://admin:1q2w3E*@mongodb:27017/?authSource=admin"
            database => "logsdb"
            collection => "8402f39f-493d-4dbd-916b-920aa79497a9"
            isodate => true
        }
        stdout { codec => rubydebug }
    }