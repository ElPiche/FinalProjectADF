input {
        elasticsearch {
            id => "8fbb07a4-f8f0-46ed-9eae-b8d4789c570c"
            hosts => [ "http://elasticsearch-dataset:9200/" ]
            query_type => "esql"
            query => 'FROM .ds-kibana_sample_data_logs-* | WHERE @timestamp >= "2025-10-01T00:00:00.000Z" AND @timestamp < "2025-11-01T00:00:00.000Z" | EVAL es_timestamp = DATE_TRUNC(1 hour, @timestamp) | STATS cn_traffic = COUNT(*) WHERE geo.src == "CN" BY es_timestamp | SORT es_timestamp'
            schedule => "*/5 * * * *"
            ecs_compatibility => disabled
        }
    }

    filter {
        mutate {
            add_field => { "kb_id" => "8fbb07a4-f8f0-46ed-9eae-b8d4789c570c" }
        }
    }

    output {
        mongodb {
            uri => "mongodb://admin:1q2w3E*@mongodb:27017/?authSource=admin"
            database => "logsdb"
            collection => "8fbb07a4-f8f0-46ed-9eae-b8d4789c570c"
            isodate => true
        }
        stdout { codec => rubydebug }
    }