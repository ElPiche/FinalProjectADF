input {
        elasticsearch {
            id => "e0efbdfd-6b45-45ee-8652-50f8bfe75c03"
            hosts => [ "http://elasticsearch-dataset:9200/" ]
            query_type => "esql"
            query => 'FROM .ds-kibana_sample_data_logs-* | EVAL es_timestamp = DATE_TRUNC(30 minutes, @timestamp) | STATS total_requests = COUNT(*), avg_bytes_transferred = AVG(bytes), total_bandwidth = SUM(bytes), unique_destinations = COUNT_DISTINCT(geo.dest), china_requests = COUNT(*) WHERE geo.dest == "CN", us_requests = COUNT(*) WHERE geo.dest == "US", error_rate = COUNT(*) WHERE response != "200" BY es_timestamp | SORT es_timestamp | LIMIT 10'
            schedule => "*/30 * * * *"
            ecs_compatibility => disabled
        }
    }

    output {
        mongodb {
            uri => "mongodb://admin:1q2w3E*@mongodb:27017/?authSource=admin"
            database => "logsdb"
            collection => "e0efbdfd-6b45-45ee-8652-50f8bfe75c03"
            isodate => true
        }
        stdout { codec => rubydebug }
    }