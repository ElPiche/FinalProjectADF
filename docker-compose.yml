version: '3.9'
services:
  elasticsearch-dataset:
    image: elasticsearch:8.19.4
    container_name: elasticsearch-dataset
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - 9200:9200
    networks:
      - adf-network
    volumes:
      - elastic_data:/usr/share/elasticsearch-dataset/data
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9200
      interval: 10s
      timeout: 5s
      retries: 10
  elasticsearch-anomalies:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    container_name: elasticsearch-anomalies
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - cluster.name=anomalies-cluster
      - node.name=anomalies-node
    ports:
      - 9201:9200
    networks:
      - adf-network
    volumes:
      - elastic_anomalies_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9200
      interval: 10s
      timeout: 5s
      retries: 10
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.3
    container_name: kibana
    restart: 'no'
    depends_on:
      - elasticsearch-dataset
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-dataset:9200
      - XPACK_SAMPLE_DATA_ENABLED=true
    ports:
      - 5601:5601
    networks:
      - adf-network
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5601/api/status
      interval: 10s
      timeout: 50s
      retries: 100
  kibana-anomalies:
    image: docker.elastic.co/kibana/kibana:8.19.3
    container_name: kibana-anomalies
    depends_on:
      - elasticsearch-anomalies
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-anomalies:9200
    ports:
      - 5602:5601
    networks:
      - adf-network
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5601/api/status
      interval: 10s
      timeout: 5s
      retries: 10
  kibana-init:
    image: docker:27-cli
    container_name: kibana-init
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - adf-network
    entrypoint: "sh -c \"

      \  echo 'Esperando a Kibana...';

      \  apk add --no-cache curl >/dev/null;

      \  until curl -sf http://kibana:5601/api/status >/dev/null; do sleep 2; done;

      \  echo 'Instalando sample data (logs)...';

      \  curl -s -XPOST http://kibana:5601/api/sample_data/logs -H 'kbn-xsrf: true' -H 'Content-Type: application/json';

      \  echo 'Sample data instalado. Deteniendo Kibana...';

      \  docker stop kibana;

      \  echo 'Kibana detenido.';

      \"\n"

  mongodb-keygen:
    image: alpine:3.20
    container_name: mongodb-keygen
    command: >
      sh -c "
        set -e;
        mkdir -p /keydir;
        # umask 077 => archivos 600 por defecto
        umask 077;
        # generar keyfile binario/base64 sin CRLF
        dd if=/dev/urandom bs=756 count=1 status=none | base64 > /keydir/keyfile;
        # el mongod corre como uid/gid 999 en la imagen oficial
        chown 999:999 /keydir/keyfile;
        chmod 600 /keydir/keyfile;
        ls -l /keydir;
      "
    volumes:
      - mongo_key:/keydir
    restart: "no"

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    command: [ "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/key/keyfile" ]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=1q2w3E*
    ports:
      - 27017:27017
    networks:
      - adf-network
    volumes:
      - mongo_data:/data/db
      - mongo_key:/data/key
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "-u", "admin", "-p", "1q2w3E*", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb-rs-init:
    image: mongo:8.0
    container_name: mongodb-rs-init
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - adf-network
    entrypoint: >
      bash -lc "
        mongosh -u admin -p 1q2w3E* --authenticationDatabase admin --host mongodb:27017 --eval '
          try { 
            rs.status() 
          } catch (e) {
            rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongodb:27017\" }]
          })
        }';
        echo 'Replica set rs0 inicializado (mongodb)';
      "
    restart: "no"

  kb-mcp:
    build:
      context: ./MCP/KB-MCP
      dockerfile: Dockerfile
    container_name: kb-mcp
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch-dataset:
        condition: service_healthy
    environment:
      - MONGO_CONNECTION_STRING=mongodb://admin:1q2w3E%2A@mongodb:27017/?authSource=admin&replicaSet=rs0
      - ES_HOSTS=http://elasticsearch-dataset:9200,http://elasticsearch-anomalies:9200
      - ALGORITHM_REGISTRY_PATH=/app/registry/algorithms.json
    ports:
      - "8000:8000"
    networks:
      - adf-network
    volumes:
      - kb_mcp_logs:/app/logs
      - algorithm_registry:/app/registry:ro
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: [ "CMD", "python", "-c", "print('KB-MCP health check: OK')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  
  extractor:
    build:
      context: ./extractor
      dockerfile: Dockerfile
    container_name: etl-app
    # restart: unless-stopped
    depends_on:
      elasticsearch-dataset:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
    - SPRING_DATA_MONGODB_DATABASE=anomaly_detection
    - SPRING_ELASTICSEARCH_URIS=http://elasticsearch-dataset:9200
    - JAVA_OPTS=-Xmx512m -Xms256m
    - SPRING_PROFILES_ACTIVE=docker
    ports:
    - 8086:8080
    networks:
    - adf-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/actuator/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  anomalies-insights:
    build:
      context: ./anomalies-insights-module
      dockerfile: Dockerfile
    container_name: anomalies-insights
    restart: unless-stopped
    depends_on:
      elasticsearch-anomalies:
        condition: service_healthy
      kibana-anomalies:
        condition: service_healthy
    environment:
    - JAVA_OPTS=-Xmx512m -Xms256m
    - SPRING_PROFILES_ACTIVE=docker
    ports:
    - 8087:8081
    networks:
    - adf-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8081/actuator/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  dispatcher:
    build:
      context: . # change to ./MotorDA if the Dockerfile is inside MotorDA
      dockerfile: Dockerfile.da-dispatcher # remove or change if your Dockerfile has another path/name
    container_name: da-dispatcher
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch-anomalies:
        condition: service_healthy
    environment:
      # use the service names (not localhost) so the container can reach them over the bridge network
      - MONGO_CONNECTION_STRING=mongodb://admin:1q2w3E%2A@mongodb:27017/?authSource=admin&replicaSet=rs0
      - ES_HOSTS=http://elasticsearch-anomalies:9200
      - PYTHONUNBUFFERED=1
      - ALGORITHM_REGISTRY_PATH=/app/registry/algorithms.json
    volumes:
      - algorithm_registry:/app/registry
    networks:
      - adf-network


  log-generator:
    build:
      context: ./log-generator
      dockerfile: Dockerfile
    container_name: log-generator
    restart: unless-stopped
    profiles:
      - stress  # Only starts with: docker-compose --profile stress up -d
      - generate-logs # Only starts with: docker-compose --profile generate-logs up -d
    depends_on:
      elasticsearch-dataset:
        condition: service_healthy
    environment:
      - ES_HOST=http://elasticsearch-dataset:9200
      - INDEX_NAME=ecommerce-logs # Index name to store logs
      - HISTORICAL_DAYS=365 # Number of historical days to generate
      - HISTORICAL_BATCH_SIZE=10000 # Number of logs to generate per batch for historical data
      - BASE_REQUESTS_PER_HOUR=2000 # Adjust base load here
      - PEAK_MULTIPLIER=4.0 # Peak hours get 4x traffic
      - HISTORICAL_ANOMALY_RATE=0.015 # 1.5% anomalies in historical data
      - CONTINUOUS_INTERVAL=1.0 # Interval in seconds for continuous log generation
      - LOGS_PER_INTERVAL_MIN=50 # Min logs per interval
      - LOGS_PER_INTERVAL_MAX=150 # Max logs per interval
      - CONTINUOUS_ANOMALY_RATE=0.02 # 2% anomalies in continuous data
      - BURST_PROBABILITY=0.03 # 3% chance of burst
      - BURST_SIZE_MIN=200 # Min logs in a burst
      - BURST_SIZE_MAX=1000 # Max logs in a burst
      # Performance tuning - balanced for speed + stability
      - NUM_WORKERS=4 # Number of parallel worker threads
      - BULK_THREAD_COUNT=16 # Number of parallel bulk streams
      - CHUNK_SIZE=5000 # Docs per bulk chunk (smaller = more parallelism)
      # =================================================================
      # GENERATION MODE: "random" or "event"
      # =================================================================
      # "random" - Original mode: independent anomalies, high throughput
      # "event"  - Event-based: realistic system events with correlated metrics
      #            Events like db_outage, ddos_attack, deployment affect 
      #            multiple metrics together (errors + latency + bytes)
      - GENERATION_MODE=event
      # Event mode settings (only used when GENERATION_MODE=event)
      # NOTE: EVENT_MODE_BASE_RPS is auto-calculated from BASE_REQUESTS_PER_HOUR!
      #       500/hour / 3600 = ~0.139 RPS (matches historical average rate)
      #       Set EVENT_MODE_BASE_RPS only if you need to override this.
      # - EVENT_MODE_BASE_RPS=0.139 # Uncomment to override auto-calculation
      - EVENT_PROBABILITY=0.0001 # Probability of new event per second (0.01% = ~1 event per 2-3 hours)
      - EVENT_MIN_DURATION=45 # Minimum event duration in seconds
      - EVENT_MAX_DURATION=120 # Maximum event duration in seconds
    networks:
      - adf-network
    # Explicitly disable Dockerfile healthcheck during long data generation
    healthcheck:
      disable: true

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    container_name: logstash
    depends_on:
      - elasticsearch-dataset
    restart: unless-stopped
    networks:
    - adf-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    volumes:
    # Pipelines
    - ./logstash/pipeline:/usr/share/logstash/pipeline
    # Config de logstash (para hot reload)
    - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    # Carpeta de logs del host, montada dentro del contenedor
    - ./logs:/var/log/app-logs
     # Carpeta para data interna (sincedb) evita perder data al reiniciar el contenedor
    - ./logstash/data:/usr/share/logstash/data #genera carpeta data en logstash en maquina host
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-dataset:9200
      - LS_JAVA_OPTS=-Xms256m -Xmx512m 
    ports:
       - "5044:5044"
       - "9600:9600"
    healthcheck:
     test: ["CMD", "curl", "-f", "http://elasticsearch-dataset:9200"]
     interval: 10s
     timeout: 5s
     retries: 10

  stack-profiler:
    build:
      context: ./stack-profiler
      dockerfile: Dockerfile
    container_name: stack-profiler
    restart: unless-stopped
    depends_on:
      elasticsearch-anomalies:
        condition: service_healthy
      kibana-anomalies:
        condition: service_healthy
    environment:
      - ES_URL=http://elasticsearch-anomalies:9200
      - KIBANA_URL=http://kibana-anomalies:5601
      - COLLECTION_INTERVAL=5
      - CREATE_DASHBOARD=true
    volumes:
      # Mount Docker socket to access Docker API from inside container
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - adf-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "profiler.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # KB Stress Generator - Stress test the stack by periodically creating configs
  kb-stress-generator:
    build:
      context: ./kb-stress-generator
      dockerfile: Dockerfile
    container_name: kb-stress-generator
    restart: unless-stopped
    profiles:
      - stress  # Only starts with: docker-compose --profile stress up
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch-dataset:
        condition: service_healthy
      dispatcher:
        condition: service_started  # Wait for dispatcher to export algorithms
    environment:
      - MONGODB_URI=mongodb://admin:1q2w3E%2A@mongodb:27017/?authSource=admin&replicaSet=rs0
      - MONGODB_DB=knowledge_base
      - MONGODB_COLLECTION=kb_configs
      - BUCKET_COLLECTION=bucket_profiles
      - ES_URL=http://elasticsearch-dataset:9200
      # IMPORTANT: These must match log-generator settings!
      - SOURCE_INDEX=ecommerce-logs  # Must match log-generator INDEX_NAME
      - HISTORICAL_DAYS=365          # Must match log-generator HISTORICAL_DAYS
      - MODE=continuous
      - MIN_INTERVAL=1
      - MAX_INTERVAL=3
      - BURST_PROBABILITY=0.1
      - BURST_SIZE_MIN=3
      - BURST_SIZE_MAX=20
      - BUCKET_PROBABILITY=0.3
      - ALGORITHM_REGISTRY_PATH=/app/registry/algorithms.json
    volumes:
      - algorithm_registry:/app/registry:ro  # Read-only access to algorithm registry
    networks:
      - adf-network


volumes:
  mongo_data: null
  elastic_data: null
  elastic_anomalies_data: null
  mongo_key: null
  kb_mcp_logs: null
  algorithm_registry: null

networks:
  adf-network:
    name: adf-network
    driver: bridge

