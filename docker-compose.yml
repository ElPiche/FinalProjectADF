version: '3.9'
services:
  elasticsearch-dataset:
    image: elasticsearch:8.19.4
    container_name: elasticsearch-dataset
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms512m -Xmx1g
    ports:
    - 9200:9200
    networks:
    - adf-network
    volumes:
    - elastic_data:/usr/share/elasticsearch-dataset/data
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9200
      interval: 10s
      timeout: 5s
      retries: 10
  elasticsearch-anomalies:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    container_name: elasticsearch-anomalies
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    - cluster.name=anomalies-cluster
    - node.name=anomalies-node
    ports:
    - 9201:9200
    networks:
    - adf-network
    volumes:
    - elastic_anomalies_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9200
      interval: 10s
      timeout: 5s
      retries: 10
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.3
    container_name: kibana
    restart: 'no'
    depends_on:
    - elasticsearch-dataset
    environment:
    - ELASTICSEARCH_HOSTS=http://elasticsearch-dataset:9200
    - XPACK_SAMPLE_DATA_ENABLED=true
    ports:
    - 5601:5601
    networks:
    - adf-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5601/api/status
      interval: 10s
      timeout: 50s
      retries: 100
  kibana-anomalies:
    image: docker.elastic.co/kibana/kibana:8.19.3
    container_name: kibana-anomalies
    depends_on:
    - elasticsearch-anomalies
    environment:
    - ELASTICSEARCH_HOSTS=http://elasticsearch-anomalies:9200
    ports:
    - 5602:5601
    networks:
    - adf-network
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5601/api/status
      interval: 10s
      timeout: 5s
      retries: 10
  kibana-init:
    image: docker:27-cli
    container_name: kibana-init
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    networks:
    - adf-network
    entrypoint: "sh -c \"\n  echo 'Esperando a Kibana...';\n  apk add --no-cache curl\
      \ >/dev/null;\n  until curl -sf http://kibana:5601/api/status >/dev/null; do\
      \ sleep 2; done;\n  echo 'Instalando sample data (logs)...';\n  curl -s -XPOST\
      \ http://kibana:5601/api/sample_data/logs -H 'kbn-xsrf: true' -H 'Content-Type:\
      \ application/json';\n  echo 'Sample data instalado. Deteniendo Kibana...';\n\
      \  docker stop kibana;\n  echo 'Kibana detenido.';\n\"\n"

  mongodb-keygen:
    image: alpine:3.20
    container_name: mongodb-keygen
    command: >
      sh -c "
        set -e;
        mkdir -p /keydir;
        # umask 077 => archivos 600 por defecto
        umask 077;
        # generar keyfile binario/base64 sin CRLF
        dd if=/dev/urandom bs=756 count=1 status=none | base64 > /keydir/keyfile;
        # el mongod corre como uid/gid 999 en la imagen oficial
        chown 999:999 /keydir/keyfile;
        chmod 600 /keydir/keyfile;
        ls -l /keydir;
      "
    volumes:
      - mongo_key:/keydir
    restart: "no"

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile","/data/key/keyfile"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=1q2w3E*
    ports:
      - 27017:27017
    networks:
      - adf-network
    volumes:
      - mongo_data:/data/db
      - mongo_key:/data/key
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "admin", "-p", "1q2w3E*", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb-rs-init:
    image: mongo:8.0
    container_name: mongodb-rs-init
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - adf-network
    entrypoint: >
      bash -lc "
        mongosh -u admin -p 1q2w3E* --authenticationDatabase admin --host mongodb:27017 --eval '
          try { 
            rs.status() 
          } catch (e) {
            rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongodb:27017\" }]
          })
        }';
        echo 'Replica set rs0 inicializado (mongodb)';
      "
    restart: "no"

  kb-mcp:
    build:
      context: ./MCP/KB-MCP
      dockerfile: Dockerfile
    container_name: kb-mcp
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch-dataset:
        condition: service_healthy
    environment:
      - MONGO_CONNECTION_STRING=mongodb://admin:1q2w3E%2A@mongodb:27017/?authSource=admin&replicaSet=rs0
      - ES_HOSTS=http://elasticsearch-dataset:9200
    ports:
      - "8000:8000"
    networks:
      - adf-network
    volumes:
      - kb_mcp_logs:/app/logs
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "print('KB-MCP health check: OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  
volumes:
  mongo_data: null
  elastic_data: null
  elastic_anomalies_data: null
  mongo_key: null
  kb_mcp_logs: null

networks:
  adf-network:
    name: adf-network
    driver: bridge
    
