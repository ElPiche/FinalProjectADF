version: "3.9"

services:
  elasticsearch-dataset:
    image: elasticsearch:8.19.4
    container_name: elasticsearch-dataset
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch-dataset/data
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch-anomalies:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.4
    container_name: elasticsearch-anomalies
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
      # - action.destructive_requires_name=true
      - cluster.name=anomalies-cluster
      - node.name=anomalies-node
    ports:
      - "9201:9200"          # host:container (corregido)
    volumes:
      - elastic_anomalies_data:/usr/share/elasticsearch/data   # ruta estándar
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.3
    container_name: kibana
    restart: "no"          # No reiniciar; se detendrá tras cargar datos
    depends_on:
      - elasticsearch-dataset
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-dataset:9200
      - XPACK_SAMPLE_DATA_ENABLED=true
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 50s
      retries: 100

  kibana-anomalies:
    image: docker.elastic.co/kibana/kibana:8.19.3
    container_name: kibana-anomalies
    depends_on:
      - elasticsearch-anomalies
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-anomalies:9200
    ports:
      - "5602:5601"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana-init:
    image: docker:27-cli           # Imagen con cliente docker
    container_name: kibana-init
    depends_on:
      kibana:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "
        echo 'Esperando a Kibana...';
        apk add --no-cache curl >/dev/null;
        until curl -sf http://kibana:5601/api/status >/dev/null; do sleep 2; done;
        echo 'Instalando sample data (logs)...';
        curl -s -XPOST http://kibana:5601/api/sample_data/logs -H 'kbn-xsrf: true' -H 'Content-Type: application/json';
        echo 'Sample data instalado. Deteniendo Kibana...';
        docker stop kibana;
        echo 'Kibana detenido.';
      "

  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=1q2w3E*
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "admin", "--password", "1q2w3E*", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  elastic_data:
  elastic_anomalies_data: