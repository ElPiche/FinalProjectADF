spring.application.name=extractor

# MongoDB Configuration (will be overridden by environment variables in Docker)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:1q2w3E*@mongodb:27017/?authSource=admin}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:extractor}

# H2 Database for Spring Batch metadata (in-memory)
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Spring Batch configuration
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=always

# Logging configuration
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.batch=INFO

# Actuator endpoints for health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always