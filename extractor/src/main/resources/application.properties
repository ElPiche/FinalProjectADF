spring.application.name=extractor

server.error.include-message=never
server.error.include-stacktrace=never
spring.output.ansi.enabled=always


# Active profile configuration - 'local' for IDE, 'docker' for containers
spring.profiles.active=local

app.mongodb.database.anomaly-detection-db=anomaly_detection
app.mongodb.database.knowledge-base-db=knowledge_base
app.mongodb.database.scheduler-db=scheduler

# MongoDB Database Configuration (common for both environments)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:1q2w3E*@localhost:27017/?authSource=admin&replicaSet=rs0}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:anomaly_detection}

# H2 Database for Spring Batch metadata (in-memory)
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# Spring Batch configuration
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-schema=always

# Logging configuration
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.batch=INFO

# Actuator endpoints for health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Elasticsearch Configuration (common for both environments)
spring.elasticsearch.username=${SPRING_ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${SPRING_ELASTICSEARCH_PASSWORD:}
logging.level.org.mongodb.driver=WARN
spring.output.ansi.enabled=always