# ===============================
# ETL SERVICE CONFIGURATION - DOCKER
# ===============================
spring.application.name=etl-logs-extractor

# ===============================
# MONGODB CONFIGURATION
# ===============================
# Config Database (source for job configurations)
spring.data.mongodb.uri=mongodb://admin:1q2w3E*@mongodb:27017/etl_config?authSource=admin
spring.data.mongodb.database=etl_config

# Target Database (destination for processed data)
app.mongodb.target.uri=mongodb://admin:1q2w3E*@mongodb:27017/etl_target?authSource=admin
app.mongodb.target.database=etl_target

# ===============================
# ELASTICSEARCH CONFIGURATION
# ===============================
app.elasticsearch.host=elasticsearch-dataset
app.elasticsearch.port=9200
app.elasticsearch.protocol=http
app.elasticsearch.username=
app.elasticsearch.password=

# ===============================
# SCHEDULING CONFIGURATION
# ===============================
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=etl-scheduler-

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.com.da.extractor=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.co.elastic.clients=WARN
logging.level.co.elastic.clients.transport=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# ACTUATOR ENDPOINTS
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.server.port=8080

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===============================
# DOCKER SPECIFIC CONFIGURATION
# ===============================
# Configuración para mejorar la inicialización en contenedores
spring.jpa.hibernate.ddl-auto=none
spring.data.mongodb.auto-index-creation=true
