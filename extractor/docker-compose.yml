version: '3.9'
services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: extractor-app
    # restart: unless-stopped
    environment:
    - SPRING_DATA_MONGODB_DATABASE=logsdb
    - SPRING_ELASTICSEARCH_URIS=http://elasticsearch-dataset:9200
    - JAVA_OPTS=-Xmx512m -Xms256m
    - SPRING_PROFILES_ACTIVE=docker
    ports:
    - 8080:8080
    networks:
    - adf-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/actuator/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  adf-network:
    external: true
    name: adf-network